<app-public-auth-wrapper messageTitle="Welcome Back."
  messageDesc="Sign in to continue managing your seamless OmniCharge experience.">
  <div
    class="bg-white/70 backdrop-blur-3xl border border-white p-8 sm:p-10 shadow-2xl rounded-3xl relative z-10 w-full mb-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-black text-slate-900 tracking-tight">Sign In</h2>
      <p class="mt-2 text-sm font-medium text-slate-500">
        Or <a routerLink="/register"
          class="font-bold text-indigo-600 hover:text-indigo-500 hover:underline transition-all">create a new
          account</a>
      </p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-4">

      <div *ngIf="errorMessage"
        class="bg-rose-50 text-rose-600 p-4 rounded-xl text-sm border border-rose-100 font-medium flex items-center gap-2">
        <mat-icon class="!text-[18px] !w-[18px] !h-[18px] shrink-0">error_outline</mat-icon>
        {{ errorMessage }}
      </div>

      <!-- Email Field -->
      <mat-form-field appearance="outline" class="w-full !mb-0">
        <mat-label>Email address</mat-label>
        <input matInput type="email" formControlName="email" placeholder="you@example.com">
        <!-- Dynamic suffix: show check if valid, mail if untouched -->
        <mat-icon matSuffix *ngIf="loginForm.get('email')?.valid && loginForm.get('email')?.touched"
          class="!text-emerald-500">check_circle</mat-icon>
        <mat-icon matSuffix *ngIf="!loginForm.get('email')?.valid || !loginForm.get('email')?.touched"
          class="!text-slate-400">mail</mat-icon>
        <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required.</mat-error>
        <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid email address.</mat-error>
      </mat-form-field>

      <!-- Password Field with Show/Hide Toggle -->
      <mat-form-field appearance="outline" class="w-full !mb-0 -mt-1">
        <mat-label>Password</mat-label>
        <input matInput [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="••••••••">
        <button mat-icon-button matSuffix type="button" (click)="showPassword = !showPassword"
          class="!text-slate-400 hover:!text-indigo-500 transition-colors">
          <mat-icon class="!text-[20px]">{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required.</mat-error>
        <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Password must be at least 8
          characters.</mat-error>
      </mat-form-field>

      <div class="flex items-center justify-between -mt-3 mb-2 px-1">
        <div class="text-xs">
          <a (click)="navigateToForgotPassword()"
            class="font-bold text-indigo-600 hover:underline cursor-pointer transition-colors">Forgot password?</a>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="loginForm.invalid || isLoading"
        [ngClass]="loginForm.valid ? 'btn-electric' : 'btn-electric-disabled opacity-50'"
        class="w-full p-[1px] flex items-center justify-center rounded-2xl shadow-lg transition-all outline-none cursor-pointer group z-20 border-none">
        <span
          class="relative z-10 w-full h-full flex items-center justify-center rounded-[15px] px-6 py-4 gap-2 font-semibold text-lg transition-colors duration-300"
          [ngClass]="loginForm.valid ? 'bg-indigo-600 group-hover:bg-indigo-700 text-white' : 'bg-transparent text-slate-500'">
          <mat-icon *ngIf="isLoading" class="animate-spin !text-[20px]">autorenew</mat-icon>
          {{ isLoading ? 'Signing in...' : 'Sign in' }}
        </span>
      </button>

      <div class="relative mt-8 mb-4">
        <div class="absolute inset-0 flex items-center">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase font-black tracking-widest">
          <span class="px-4 bg-white/70 backdrop-blur-xl text-slate-400 rounded-full">Or connect with</span>
        </div>
      </div>

      <div id="google-btn-container" class="flex justify-center w-full h-[40px] items-center"></div>

    </form>
  </div>
</app-public-auth-wrapper>
