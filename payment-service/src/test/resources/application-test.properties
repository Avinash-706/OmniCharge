# H2 In-Memory Database Configuration for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Eureka for tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Disable Config Server for tests
spring.cloud.config.enabled=false

# RabbitMQ Test Configuration (use embedded or mock)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Razorpay Test Configuration (mock values)
razorpay.key.id=test_key_id
razorpay.key.secret=test_key_secret

# Disable Actuator endpoints for tests
management.endpoints.enabled-by-default=false
