spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    config:
      enabled: false
      
eureka:
  client:
    enabled: false
    
management:
  endpoints:
    web:
      exposure:
        include: health,info

numverify:
  api:
    key: test-api-key
    base-url: https://apilayer.net/api
