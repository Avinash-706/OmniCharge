# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Eureka for tests
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

# Disable Config Server for tests
spring.cloud.config.enabled=false

# Disable RabbitMQ auto-configuration for tests (will be mocked)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# Disable Email/SMS for tests (will be mocked)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test@test.com
spring.mail.password=test

# Twilio Test Configuration (will be mocked)
twilio.account.sid=test_sid
twilio.auth.token=test_token
twilio.phone.number=+1234567890

# Disable Actuator Security for tests
management.security.enabled=false
